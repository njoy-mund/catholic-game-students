<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catholic Student Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #1a103c, #2b1d5e, #1e3a8a, #3b1d5e);
      background-size: 400% 400%;
      animation: gradientBG 14s ease infinite;
      color: #ffffff;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating golden light particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      background: radial-gradient(circle, rgba(255, 223, 107, 0.9) 0%, rgba(255, 223, 107, 0) 70%);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-105vh) scale(0.4); opacity: 0; }
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header styling & glow */
    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.8s ease-out;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.45);
      color: #ffd700;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #ffe066, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineText 5s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes shineText {
      to { background-position: 200% center; }
    }

    p.subtitle {
      color: #cbd5e1;
      font-size: 1.05rem;
    }

    /* Chapter Section */
    .chapter-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffd700;
      margin: 30px 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }

    .chapter-title::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.6), transparent);
    }

    /* Placeholder for chapters with no games yet */
    .empty-notice {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.95rem;
      text-align: center;
    }

    /* Game Cards Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .game-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      text-decoration: none;
      color: #ffffff;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease,
                  border-color 0.3s ease,
                  background 0.3s ease;
      animation: cardPop 0.6s ease-out backwards;
    }

    /* Staggered entrance animation */
    .game-card:nth-child(1) { animation-delay: 0.1s; }
    .game-card:nth-child(2) { animation-delay: 0.2s; }
    .game-card:nth-child(3) { animation-delay: 0.3s; }
    .game-card:nth-child(4) { animation-delay: 0.4s; }
