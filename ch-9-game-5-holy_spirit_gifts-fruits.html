<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Spirit Gifts & Fruits Game</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-gift: #e3f2fd;
            --card-gift-border: #90caf9;
            --card-fruit: #e8f5e9;
            --card-fruit-border: #a5d6a7;
            --correct-color: #c8e6c9;
            --wrong-color: #ffcdd2;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; text-align: center; }
        .controls {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            font-size: 1.2rem;
            align-items: center;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .timer { font-weight: bold; color: #e74c3c; background: white; padding: 5px 15px; border-radius: 20px; border: 2px solid #e74c3c; }
        .score { font-weight: bold; color: #27ae60; background: white; padding: 5px 15px; border-radius: 20px; border: 2px solid #27ae60; }
        .game-container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 45%;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-size: 0.95rem;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .card.gift { background-color: var(--card-gift); border-color: var(--card-gift-border); }
        .card.fruit { background-color: var(--card-fruit); border-color: var(--card-fruit-border); }
        .card.selected { border-color: #9b59b6; background-color: #f3e5f5; transform: scale(1.02); }
        .card.correct { background-color: var(--correct-color) !important; border-color: #4caf50 !important; cursor: default; pointer-events: none; opacity: 0.6; }
        .card.wrong { background-color: var(--wrong-color) !important; border-color: #f44336 !important; animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab {
            padding: 8px 16px;
            background: #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab.active { background: #2c3e50; color: white; }
    </style>
</head>
<body>

    <h1>🕊️ Gifts & Fruits of the Holy Spirit Game</h1>
    <p>Select a trait on the left, then click its matching meaning on the right!</p>

    <div class="tabs">
        <div class="tab active" onclick="switchMode('gifts')">🎁 The 7 Gifts</div>
        <div class="tab" onclick="switchMode('fruits')">🍇 The 12 Fruits</div>
    </div>

    <div class="controls">
        <button class="btn" onclick="startGame()">🔄 Restart Game</button>
        <div class="timer">⏳ Time: <span id="timer-val">60</span>s</div>
        <div class="score">✨ Score: <span id="score-val">0</span></div>
    </div>

    <div class="game-container">
        <div class="column" id="left-col"></div>
        <div class="column" id="right-col"></div>
    </div>

    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2 id="modal-title">🎉 Game Over!</h2>
            <p id="modal-desc"></p>
            <button class="btn" onclick="closeModal()">Play Again</button>
        </div>
    </div>

    <script>
        const giftsData = [
            { item: "🧠 Wisdom", desc: "Helping us see things from God's perspective and divine plan." },
            { item: "💡 Understanding", desc: "Deepening our insight into the core mysteries and truths of faith." },
            { item: "🗣️ Counsel", desc: "Guiding our conscience to make practical, good, and moral decisions." },
            { item: "🛡️ Fortitude", desc: "Giving us supernatural strength and courage to stand up for what is right." },
            { item: "📚 Knowledge", desc: "Helping us know God’s will and understanding the true value of creation." },
            { item: "🙏 Piety", desc: "Inspiring a deep, loving reverence and affection for God as our Father." },
            { item: "🌌 Fear of the Lord", desc: "Keeping us filled with wonder, awe, and a pure dread of offending God." }
        ];

        const fruitsData = [
            { item: "❤️ Charity", desc: "Infusing a divine love to value God above all things and care for neighbor." },
            { item: "☀️ Joy", desc: "A deep-down, lasting happiness that remains steady regardless of circumstances." },
            { item: "🕊️ Peace", desc: "A tranquil and calm heart that completely trusts God instead of worrying." },
            { item: "⏳ Patience", desc: "Enduring trials, hardships, and delays calmly without getting angry." },
            { item: "🤝 Kindness", desc: "Being warm-hearted, friendly, generous, and deeply considerate to everyone." },
            { item: "🌟 Goodness", desc: "Actively choosing to do what is right, honorable, and pure in behavior." },
            { item: "⚓ Longanimity", desc: "The quiet endurance of long-lasting difficulties or delayed promises." },
            { item: "🌱 Mildness", desc: "Being tender, gentle, humble, and calm instead of reacting with harshness." },
            { item: "💎 Faith", desc: "Firmly believing all the truths God has revealed with absolute loyalty." },
            { item: "🧼 Modesty", desc: "Behaving, speaking, and dressing cleanly to guard purity and show respect." },
            { item: "🛡️ Continency", desc: "Resisting temporary physical temptations and maintaining total self-control." },
            { item: "🤍 Chastity", desc: "Successfully integrating human sexuality perfectly according to your state in life." }
        ];

        let currentMode = 'gifts';
        let selectedLeft = null;
        let score = 0;
        let timer = 60;
        let timerInterval = null;
        let gameActive = false;

        function shuffle(array) {
            return array.map(a => ({ sort: Math.random(), value: a }))
                .sort((a, b) => a.sort - b.sort)
                .map(a => a.value);
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            startGame();
        }

        function startGame() {
            clearInterval(timerInterval);
            score = 0;
            timer = currentMode === 'gifts' ? 45 : 90;
            selectedLeft = null;
            gameActive = true;
            document.getElementById('score-val').innerText = score;
            document.getElementById('timer-val').innerText = timer;

            const data = currentMode === 'gifts' ? giftsData : fruitsData;
            const leftData = shuffle([...data]);
            const rightData = shuffle([...data]);

            const leftCol = document.getElementById('left-col');
            const rightCol = document.getElementById('right-col');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            leftData.forEach((d, idx) => {
                const div = document.createElement('div');
                div.className = `card ${currentMode === 'gifts' ? 'gift' : 'fruit'}`;
                div.innerText = d.item;
                div.dataset.id = d.item;
                div.onclick = () => selectLeftCard(div);
                leftCol.appendChild(div);
            });

            rightData.forEach((d, idx) => {
                const div = document.createElement('div');
                div.className = `card ${currentMode === 'gifts' ? 'gift' : 'fruit'}`;
                div.innerText = d.desc;
                div.dataset.match = d.item;
                div.onclick = () => selectRightCard(div);
                rightCol.appendChild(div);
            });

            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer-val').innerText = timer;
                if (timer <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function selectLeftCard(card) {
            if (!gameActive || card.classList.contains('correct')) return;
            document.querySelectorAll('#left-col .card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedLeft = card;
        }

        function selectRightCard(card) {
            if (!gameActive || !selectedLeft || card.classList.contains('correct')) return;

            if (selectedLeft.dataset.id === card.dataset.match) {
                selectedLeft.classList.remove('selected');
                selectedLeft.classList.add('correct');
                card.classList.add('correct');
                selectedLeft = null;
                score += 10;
                document.getElementById('score-val').innerText = score;

                const totalNeeded = currentMode === 'gifts' ? giftsData.length : fruitsData.length;
                if (document.querySelectorAll('.card.correct').length === totalNeeded * 2) {
                    endGame(true);
                }
            } else {
                card.classList.add('wrong');
                selectedLeft.classList.add('wrong');
                setTimeout(() => {
                    card.classList.remove('wrong');
                    if(selectedLeft) selectedLeft.classList.remove('wrong');
                }, 3000);
            }
        }

        function endGame(won) {
            gameActive = false;
            clearInterval(timerInterval);
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');

            if (won) {
                title.innerText = "🎉 Amazing Job!";
                desc.innerText = `You successfully matched all the items for the ${currentMode}! 
Final Score: ${score} points with ${timer}s remaining!`;
            } else {
                title.innerText = "⏳ Time's Up!";
                desc.innerText = `Keep practicing! You scored ${score} points. Try again to beat the clock!`;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
            startGame();
        }

        window.onload = startGame;
    </script>
</body>
</html>
